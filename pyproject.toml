[build-system]
requires = [
    "setuptools>=44.1.1; python_version < '3'",
    "setuptools>=59.6; python_version >= '3'",
    # Python 2 setuptools imports the package to read its version.
    "html5lib>=1.1; python_version < '3'",
    "six; python_version < '3'",
]
build-backend = "setuptools.build_meta"

[tool.black]
target-version = ['py27', 'py38']

