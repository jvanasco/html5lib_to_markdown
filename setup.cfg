[metadata]
name = html5lib_to_markdown
version = attr: html5lib_to_markdown.__VERSION__
author = Jonathan Vanasco
author_email = jonathan@findmeon.com
description = extract markdown flavored text from html
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    Intended Audience :: Developers
    Programming Language :: Python
    Programming Language :: Python :: 2
    Programming Language :: Python :: 2.7
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.6
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Programming Language :: Python :: 3.15

[options]
package_dir =
    = src
packages = find:
include_package_data = True
zip_safe = False
install_requires =
    html5lib>=1.1
    six

[options.packages.find]
where = src

[options.extras_require]
testing =
    pytest

[flake8]
# E501 line too long (180 > 160 characters)
# W503 line break before binary operator

ignore = E501, W503

exclude = 
	build
	dist
	.eggs
	.tox
	tests_working

import_order_style = appnexus
application-import-names =
	html5lib_to_markdown
